<!DOCTYPE html>
<html>
<head>
  <title>Farewell Invitation</title>

  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

  <!-- Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: 'Pacifico', cursive;
      text-align: center;
      background: linear-gradient(to right, #ffd6e0, #cde7ff);
      overflow: hidden;
    }

    .page { display: none; margin-top: 80px; }
    .active { display: block; }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      width: 320px;
      margin: auto;
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      background: #ff8fab;
      color: white;
      border-radius: 20px;
      cursor: pointer;
    }

    input {
      padding: 10px;
      border-radius: 20px;
      border: none;
    }

    /* Poster Styling /
    .poster {
      background: linear-gradient(#fff0f5, #ffe4ec);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    / Floating Hearts */
    .heart {
      position: absolute;
      color: #ff8fab;
      animation: floatUp 6s linear infinite;
      font-size: 20px;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-10vh); opacity: 0; }
    }
  </style>
</head>

<body>

<!-- Floating Hearts -->
<script>
setInterval(() => {
  let heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "💖";
  heart.style.left = Math.random() * 100 + "vw";
  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 6000);
}, 800);
</script>

<!-- Page 1 -->
<div id="page1" class="page active">
  <h1>🎓✨ Farewell Invite ✨</h1>
  <p>Enter your name 💌</p>
  <input id="nameInput" placeholder="Your Name">
  <br><br>
  <button onclick="goToPage2()">Unlock 💖</button>
</div>

<!-- Page 2 (Poster Page) -->
<div id="page2" class="page">
  <div class="poster">
    <h2>🌸 Senior Farewell 🌸</h2>
    <p id="posterText"></p>
    <p>📅 May 5 | ⏰ 10 AM</p>
    <p>🏫 MAX Department</p>
    <button onclick="nextPage(3)">Continue ➡️</button>
  </div>
</div>

<!-- Page 3 -->
<div id="page3" class="page">
  <div class="card">
    <h2>Will you come? 🥺</h2>
    <button onclick="accept()">Yes 💕</button>
    <button onclick="decline()">No 😢</button>
  </div>
</div>

<script>
let userName = "";

// Typing effect
function typeText(text, elementId) {
  let i = 0;
  let element = document.getElementById(elementId);
  element.innerHTML = "";

  function typing() {
    if (i < text.length) {
      element.innerHTML += text.charAt(i);
      i++;
      setTimeout(typing, 40);
    }
  }
  typing();
}

function goToPage2() {
  userName = document.getElementById("nameInput").value;

  if(userName === "") {
    alert("Enter your name 💌");
  } else {
    nextPage(2);

    let msg = "Dear " + userName + ",\n\nYou're invited to celebrate memories, laughter & goodbyes 🎉💖";
    typeText(msg, "posterText");
  }
}

function nextPage(page) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById("page" + page).classList.add("active");
}

// Confetti on Accept
function accept() {
  confetti({
    particleCount: 150,
    spread: 70,
    origin: { y: 0.6 }
  });

  setTimeout(() => {
    alert("Yay " + userName + "! 🎉 See you there 💕");
  }, 500);
}

function decline() {
  if(confirm("Are you sure, " + userName + "? 🥺")) {
    alert("We’ll miss you 😢💔");
  }
}
</script>

</body>
